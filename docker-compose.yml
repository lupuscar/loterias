services:
  primitiva-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: primitiva_analytics
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.primitiva.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.primitiva.entrypoints=websecure"
      - "traefik.http.routers.primitiva.tls=true"
      - "traefik.http.services.primitiva.loadbalancer.server.port=8000"
      - "traefik.http.routers.primitiva.middlewares=filtro-ip@file, limite-peticiones@file, cabeceras-seguras@file"

networks:
  traefik_network:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
